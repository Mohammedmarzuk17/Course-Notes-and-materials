<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fact-Check Results</title>

  <style>
    /* ============================ */
    /* Base Styling */
    /* ============================ */
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 12px;
      background: #f9f9f9;
      color: #1a202c;
      font-size: 14px;
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: 22px;
      background: linear-gradient(90deg, #4776E6, #8E54E9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h3 {
      margin: 10px 0 6px;
      font-size: 16px;
    }

    /* ============================ */
    /* Main Container */
    /* ============================ */
    #resultBox {
      max-height: 460px;
      overflow-y: auto;
      padding: 6px;
    }

    /* ============================ */
    /* Sections */
    /* ============================ */
    .section {
      margin-bottom: 14px;
      padding: 10px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* ============================ */
    /* Cards */
    /* ============================ */
    .card {
      padding: 8px;
      margin-bottom: 6px;
      border-radius: 6px;
      background: #f8fafc;
      border-left: 4px solid #4776E6;
    }

    .card-text {
      margin-top: 4px;
      line-height: 1.4;
    }

    /* ============================ */
    /* Badges */
    /* ============================ */
    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 12px;
      border-radius: 12px;
      margin-right: 6px;
      font-weight: 600;
    }

    .badge-factual {
      background: #DCFCE7;
      color: #166534;
    }

    .badge-opinion {
      background: #FEF3C7;
      color: #92400E;
    }

    .badge-other {
      background: #E2E8F0;
      color: #1E293B;
    }

    .badge-ai {
      background: #FEE2E2;
      color: #7F1D1D;
    }

    .badge-human {
      background: #DBEAFE;
      color: #1E40AF;
    }

    .score {
      font-size: 12px;
      color: #555;
      margin-left: 4px;
    }

    /* ============================ */
    /* Scrollbar (optional polish) */
    /* ============================ */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <h2>Fact-Check Results</h2>

  <div id="resultBox">
    <!-- JS will inject content here -->
    Waiting for fact-check results...
  </div>

  <!-- External JS -->
  <script src="factcheckview.js"></script>
</body>
</html>
