<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EduShield Popup</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    /* Optional: fallback styling for toast */
    #blocklist-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 9999;
      text-align: center;
      display: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="popup-container">
    <h2>EduShield</h2>

<p style="font-size:13px;color:#444;">
  Total Blocklist: <strong id="totalBlocklists">0</strong>
</p>


    <!-- Allowlist -->
    <section>
      <h3>Allowlist</h3>
      <input id="allowInput" type="text" placeholder="example.com or sub.example.com">
      <button id="addAllowBtn" class="primary-btn">Add</button>
      <button id="importAllowBtn" class="secondary-btn">Import</button>
      <button id="exportAllowBtn" class="secondary-btn">Export</button>
      <button id="clearAllowBtn" class="clear-btn">Clear All</button>
      <p style="font-size:11px;color:#555;">Allowlist import/export only supports txt files</p>
      <ul id="allowList"></ul>
      <button id="showMoreAllow" class="secondary-btn">Show More</button>
    </section>

    <!-- Custom feeds -->
    <section>
      <h3>Custom Feeds</h3>
      <input id="fileInput" type="file" multiple>
      <button id="uploadBtn" class="primary-btn">Upload</button>
      <button id="clearCustomFeedsBtn" class="clear-btn">Clear All</button>
      <p style="font-size:11px;color:#555;">csv/txt/json/html/pdf supported</p>
      <ul id="customList"></ul>
      <button id="showMoreCustom" class="secondary-btn">Show More</button>
    </section>

    <!-- Feed URLs -->
    <section>
      <h3>Feed URLs</h3>
      <input id="feedUrlInput" type="text" placeholder="https://example.com/feed.csv">
      <button id="addFeedUrlBtn" class="primary-btn">Add</button>
      <ul id="feedUrlList"></ul>
      <button id="showMoreFeed" class="secondary-btn">Show More</button>
    </section>

    <!-- Fact Check -->
    <section>
      <h3>AI Fact Check</h3>
      <textarea id="factCheckInput" placeholder="Paste text here for AI fact check"></textarea>
      <div id="charCounter" style="font-size:12px; color:#555; margin-bottom:6px;">0 / 1750</div>
      <button id="runFactCheckBtn" class="primary-btn" disabled>Run Fact Check <span id="spinner" style="display:none;">⏳</span></button>
    </section>

    <!-- Flagged domain -->
    <section id="flaggedDomainSection" style="display:none;">
      <h3>Flagged Domain</h3>
      <p id="flaggedDomain"></p>
      <p id="flaggedSources"></p>
      <button id="learnMoreBtn" class="primary-btn">Learn More</button>
      <button id="dismissBtn" class="secondary-btn">Dismiss</button>
      <button id="allowBtn" class="primary-btn">Allow</button>
    </section>

    <!-- Notification bubble -->
    <div id="popup-notification"></div>
  </div>

  <!-- Toast for blocklist updates -->
  <div id="blocklist-toast"></div>

  <!-- Use module script for browser-friendly JS -->
  <script type="module" src="popup.js"></script>
</body>
</html>
